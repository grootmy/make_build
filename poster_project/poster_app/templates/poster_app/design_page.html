<!DOCTYPE html>
<html>
<head>
    <title>Design - {{ project.name }}</title>
    <style>
        .container {
            display: flex;
            height: 100vh;
        }
        .chat-ui {
            width: 30%;
            border-right: 1px solid #ccc;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }
        .chat-history {
            flex-grow: 1;
            overflow-y: auto;
            border: 1px solid #eee;
            padding: 10px;
            margin-bottom: 10px;
        }
        .chat-message {
            margin-bottom: 5px;
            padding: 8px;
            border-radius: 5px;
        }
        .chat-message.user {
            text-align: right;
            background-color: #dcf8c6;
        }
        .chat-message.bot {
            text-align: left;
            background-color: #f1f0f0;
        }
        .preview-canvas {
            width: 70%;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .poster-preview {
            width: 500px;
            height: 750px;
            border: 1px solid #000;
            padding: 20px;
            text-align: center;
            background-color: {{ design_data.background_color|default:"#eee" }};
        }
        .poster-preview h1 {
            font-size: 48px;
        }
    </style>
</head>
<body>
    <h1>Design for {{ project.name }}</h1>
    <div class="container">
        <div class="chat-ui">
            <h2>Chat</h2>
            <div id="chat-history" class="chat-history">
                {% for entry in chat_history %}
                    <div class="chat-message {{ entry.sender }}">
                        <strong>{{ entry.sender }}:</strong> {{ entry.message }}
                    </div>
                {% endfor %}
            </div>
            <form id="chat-form">
                {% csrf_token %}
                <input type="text" id="chat-input" placeholder="Type your message here..." style="width: 80%;">
                <button type="submit">Send</button>
            </form>
        </div>
        <div class="preview-canvas">
            <div id="poster-preview" class="poster-preview">
                <h1 id="poster-title">{{ design_data.title_text|default:"Your Title Here" }}</h1>
            </div>
        </div>
    </div>

    <script>
        const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]').value;

        document.getElementById('chat-form').addEventListener('submit', async function(event) {
            event.preventDefault();

            const input = document.getElementById('chat-input');
            const message = input.value.trim();

            if (message === '') return;

            appendMessage('user', message);
            input.value = '';

            const response = await fetch("{% url 'chat_message' project.id %}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken
                },
                body: JSON.stringify({ message: message })
            });

            const data = await response.json();

            appendMessage(data.sender, data.message);
            updatePreview(data.design_update);
        });

        function appendMessage(sender, message) {
            const chatHistory = document.getElementById('chat-history');
            const messageDiv = document.createElement('div');
            messageDiv.className = `chat-message ${sender}`;
            messageDiv.innerHTML = `<strong>${sender}:</strong> ${message}`;
            chatHistory.appendChild(messageDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function updatePreview(designUpdate) {
            const preview = document.getElementById('poster-preview');
            const title = document.getElementById('poster-title');

            if (designUpdate.background_color) {
                preview.style.backgroundColor = designUpdate.background_color;
            }
            if (designUpdate.title_text) {
                title.innerText = designUpdate.title_text;
            }
        }
    </script>
</body>
</html>
