{% extends 'poster_app/base.html' %}

{% block title %}Design - {{ project.name }}{% endblock %}

{% block content %}
<div class="container-fluid" style="height: calc(100vh - 56px);">
    <div class="row h-100">
        <div class="col-md-4 h-100 d-flex flex-column border-end">
            <h2 class="py-3">Chat</h2>
            <div id="chat-history" class="chat-history flex-grow-1 p-3 bg-light border rounded mb-3" style="overflow-y: auto;">
                {% for entry in chat_history %}
                    <div class="chat-message mb-2 p-2 rounded {% if entry.sender == 'user' %}bg-primary text-white text-end{% else %}bg-secondary text-white{% endif %}">
                        <strong>{{ entry.sender }}:</strong> {{ entry.message }}
                    </div>
                {% endfor %}
            </div>
            <form id="chat-form" class="mt-auto">
                {% csrf_token %}
                <div class="input-group">
                    <input type="text" id="chat-input" class="form-control" placeholder="Type your message here...">
                    <button type="submit" class="btn btn-primary">Send</button>
                </div>
            </form>
        </div>
        <div class="col-md-8 h-100 d-flex align-items-center justify-content-center">
            <div id="poster-preview" class="poster-preview shadow-lg" style="width: 500px; height: 750px; background-color: {{ design_data.background_color|default:'#eee' }}; padding: 20px; text-align: {{ design_data.text_align|default:'center' }};">
                <h1 id="poster-title" style="font-size: {{ design_data.font_size|default:'48px' }};">{{ design_data.title_text|default:"Your Title Here" }}</h1>
            </div>
        </div>
    </div>
</div>

<script>
    const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]').value;

    document.getElementById('chat-form').addEventListener('submit', async function(event) {
        event.preventDefault();
        const input = document.getElementById('chat-input');
        const message = input.value.trim();
        if (message === '') return;

        appendMessage('user', message);
        input.value = '';

        const response = await fetch("{% url 'chat_message' project.id %}", {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrftoken },
            body: JSON.stringify({ message: message })
        });

        const data = await response.json();
        appendMessage(data.sender, data.message);
        updatePreview(data.design_update);
    });

    function appendMessage(sender, message) {
        const chatHistory = document.getElementById('chat-history');
        const messageDiv = document.createElement('div');
        messageDiv.className = `chat-message mb-2 p-2 rounded ${sender === 'user' ? 'bg-primary text-white text-end' : 'bg-secondary text-white'}`;
        messageDiv.innerHTML = `<strong>${sender}:</strong> ${message}`;
        chatHistory.appendChild(messageDiv);
        chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    function updatePreview(designUpdate) {
        const preview = document.getElementById('poster-preview');
        const title = document.getElementById('poster-title');

        if (designUpdate.background_color) {
            preview.style.backgroundColor = designUpdate.background_color;
        }
        if (designUpdate.title_text) {
            title.innerText = designUpdate.title_text;
        }
        if (designUpdate.font_size) {
            title.style.fontSize = designUpdate.font_size;
        }
        if (designUpdate.text_align) {
            preview.style.textAlign = designUpdate.text_align;
        }
    }
</script>
{% endblock %}
