<!DOCTYPE html>
<html>
<head>
    <title>My Projects</title>
</head>
<body>
    <h1>My Projects</h1>

    <p>
        <a href="{% url 'profile_page' %}">My Profile</a> |
        <a href="{% url 'logout' %}">Logout</a>
    </p>

    <h2>Create New Project</h2>
    <form method="post" action="{% url 'project_create' %}">
        {% csrf_token %}
        <input type="text" name="name" placeholder="Project Name" required>
        <textarea name="description" placeholder="Description"></textarea>
        <button type="submit">Create</button>
    </form>

    <hr>

    <h2>Existing Projects</h2>
    <ul>
        {% for project in projects %}
            <li>
                <a href="{% url 'design_page' project.id %}">
                    {{ project.name }}
                </a>
                - <span>{{ project.description|default:"No description" }}</span>

                <a href="{% url 'project_update' project.id %}">Edit</a>

                <form method="post" action="{% url 'project_delete' project.id %}" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit" onclick="return confirm('Are you sure you want to delete this project?');">Delete</button>
                </form>
            </li>
        {% empty %}
            <li>No projects yet.</li>
        {% endfor %}
    </ul>

</body>
</html>
